name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip -q FlappyLoloy-AndroidStudio.zip -d work
      - run: cd work/FlappyLoloy && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Flappy-Loloy-APK
          path: work/FlappyLoloy/app/build/outputs/apk/debug/app-debug.apk
